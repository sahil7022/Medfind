services:
  # ─── Node.js Backend API ──────────────────────────────────────────────────
  - type: web
    name: medfind-api
    runtime: node
    region: singapore   # closest to India
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medfind-db
          property: connectionString
      - key: GOOGLE_PLACES_API_KEY
        sync: false   # set manually in Render dashboard

  # ─── PostgreSQL Database ──────────────────────────────────────────────────
databases:
  - name: medfind-db
    plan: free
    region: singapore
    postgresMajorVersion: 16
